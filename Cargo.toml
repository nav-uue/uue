[package]
name = "uue"
version = "0.1.0"
edition = "2024"
description = "CLI file encryption utility powered by AES-GCM."
license = "MIT"
repository = "https://github.com/nav-uue/uue"

[dependencies]
aes-gcm = "0.11.1"
clap = { version = "4.0", features = ["derive"] }
argon2 = { version = "0.6.0", features = ["alloc"] }
rpassword = "7.5.4"
walkdir = "2.5.0"
rand = "0.8"